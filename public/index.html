<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0D0F14" />
        <meta name="description" content="SYNQ — Every venue. Every supplier. Every event. In SYNQ." />
        <title>SYNQ — The Operating System for Events</title>
        <!-- These fonts' licenses (Fontshare/ITF) prohibit self-hosting without
             written consent, so they're loaded via Fontshare's official API
             rather than bundled — the sanctioned way to use them. Satoshi is
             reserved for the SYNQ brand wordmark; Clash Display drives headings
             and General Sans drives body copy, so the type system reads as
             deliberately different from a generic system-font site. -->
        <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&f[]=clash-display@500,600,700&f[]=general-sans@400,500,600,700&display=swap"
        />
        <!-- GitHub Pages SPA fallback: decodes the redirect 404.html encodes,
             restoring the real path before React Router reads the URL. -->
        <script type="text/javascript">
            (function (l) {
                if (l.search[1] === "/") {
                    var decoded = l.search
                        .slice(1)
                        .split("&")
                        .map(function (s) {
                            return s.replace(/~and~/g, "&");
                        })
                        .join("?");
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            })(window.location);
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
